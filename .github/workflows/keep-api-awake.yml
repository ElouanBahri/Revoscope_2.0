# Render's free tier puts the API to sleep after 15 idle minutes, and waking
# it takes ~40-60s — the main remaining cause of slow page loads. Pinging
# /health every 10 minutes keeps it awake. One always-on free service
# (~744h in a 31-day month) fits within Render's 750 free hours/month.
#
# Caveats: GitHub may run scheduled jobs late at busy times, and disables
# them after 60 days with no commits to the repo (re-enable from the
# Actions tab).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://revoscope-api.onrender.com/health
